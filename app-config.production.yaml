app:
  baseUrl: ${APP_BASE_URL:-http://localhost:3000}

backend:
  # Browser API requests use the frontend origin and are proxied by nginx.
  baseUrl: ${APP_BASE_URL:-http://localhost:3000}
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  environment: production
  providers:
    local:
      production: {}

catalog:
  # Overrides the default list locations from app-config.yaml as these contain example data.
  # See https://backstage.io/docs/features/software-catalog/#adding-components-to-the-catalog for more details
  # on how to get entities into the catalog.
  locations:
    # Local example data, replace this with your production config, these are intended for demo use only.
    # File locations are relative to the backend process, typically in a deployed context, such as in a Docker container, this will be the root
    - type: file
      target: ./examples/entities.yaml

    # Local example template
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    # GitLab Repository Template
    - type: file
      target: ./templates/gitlab-repo-template/template.yaml
      rules:
        - allow: [Template]

    # GitHub repository template
    - type: file
      target: ./templates/github-repo-template/template.yaml
      rules:
        - allow: [Template]

    # Project archetypes published to the configured GitLab instance
    - type: file
      target: ./templates/rest-api-service/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/event-driven-service/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/background-worker/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/react-frontend/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/full-stack-application/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/kubernetes-workload/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/helm-chart/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/aks-application/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./templates/terraform-module/template.yaml
      rules:
        - allow: [Template]
    - type: file
