version: '3.8'

# ======================================================================
# docker-compose.linux.yml — Backstage Complete Stack (Linux)
#
# Services: backstage-backend, backstage-frontend, postgres
#
# Complete single-file Docker Compose for Linux. Includes backend API,
# frontend SPA, and PostgreSQL database.
#
# Prerequisites:
#   Before running, build the backend dist in the repo root:
#     yarn install --immutable
#     yarn tsc
#     yarn build:backend
#     yarn workspace app build
#
# Usage:
#   # Run the complete stack (backend + frontend + postgres)
#   docker compose -f docker-compose.linux.yml up --build
#
#   # Run without postgres (if using external database)
#   docker compose -f docker-compose.linux.yml up --build -d backstage-backend backstage-frontend
#
#   # View logs
#   docker compose -f docker-compose.linux.yml logs -f
#
#   # Stop the stack
#   docker compose -f docker-compose.linux.yml down
#
#   # Clean up volumes (warning: deletes database)
#   docker compose -f docker-compose.linux.yml down -v
#
# Access:
#   Frontend: http://localhost:3000
#   Backend: http://localhost:7007
#   Backend Health: http://localhost:7007/healthcheck
# ======================================================================

services:
  # ========== PostgreSQL Database ==========
  postgres:
    image: postgres:17-alpine
    container_name: backstage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      POSTGRES_DB: backstage
    ports:
      - "5432:5432"
    volumes:
      - backstage_data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstage"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Backstage Backend (Node.js API Server) ==========
  backstage-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.linux
    image: backstage-backend:linux
    container_name: backstage-backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--no-node-snapshot"
      PORT: 7007
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # GitHub integration (optional)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ORG: ${GITHUB_ORG:-}
      # GitLab integration (optional; use the hostname only)
      GITLAB_HOST: ${GITLAB_HOST:-gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      KDASHM_AGENT_MODELS_FILE: /app/kdashm-agent-models.json
      # Database configuration
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
    volumes:
      - ./app-config.yaml:/app/app-config.yaml:ro
      - ./app-config.production.yaml:/app/app-config.production.yaml:ro
      - ./kdashm-agent-models.json:/app/kdashm-agent-models.json:ro
      - ./examples:/app/examples:ro
      - ./templates:/app/templates:ro
      - ./infra-agent:/app/infra-agent
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7007/healthcheck').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ========== Backstage Frontend (nginx Static SPA) ==========
  backstage-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.linux
      args:
        APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    image: backstage-frontend:linux
    container_name: backstage-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backstage-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  backstage_data:
    driver: local

networks:
  default:
    driver: bridge
