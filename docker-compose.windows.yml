version: '3.8'

# ======================================================================
# docker-compose.windows.yml — Backstage Complete Stack (Windows)
#
# Services: backstage-backend, backstage-frontend, postgres
#
# Complete single-file Docker Compose for Windows. Includes backend API,
# frontend SPA, and PostgreSQL database.
#
# REQUIRES: Docker Desktop with Windows container mode enabled.
#
# Prerequisites:
#   Before running, build the backend dist in the repo root:
#     yarn install --immutable
#     yarn tsc
#     yarn build:backend
#     yarn workspace app build
#
# Usage:
#   # Run the complete stack (backend + frontend + postgres)
#   docker compose -f docker-compose.windows.yml up --build
#
#   # Run without postgres (if using external database)
#   docker compose -f docker-compose.windows.yml up --build -d backstage-backend backstage-frontend
#
#   # View logs
#   docker compose -f docker-compose.windows.yml logs -f
#
#   # Stop the stack
#   docker compose -f docker-compose.windows.yml down
#
#   # Clean up volumes (warning: deletes database)
#   docker compose -f docker-compose.windows.yml down -v
#
# Access:
#   Frontend: http://localhost:3000
#   Backend: http://localhost:7007
#   Backend Health: http://localhost:7007/healthcheck
# ======================================================================

services:
  # ========== PostgreSQL Database (Windows) ==========
  # Note: PostgreSQL on Windows containers uses Linux subsystem layer.
  # For production on Windows, consider using a separate Windows container for PostgreSQL
  # or an external database service.
  postgres:
    image: postgres:17-alpine
    container_name: backstage-postgres-win
    restart: unless-stopped
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      POSTGRES_DB: backstage
    ports:
      - "5432:5432"
    volumes:
      - backstage_data_win:C:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "backstage"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Backstage Backend (Node.js API Server) ==========
  backstage-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.windows
    image: backstage-backend:windows
    container_name: backstage-backend-win
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    ports:
      - "7007:7007"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--no-node-snapshot"
      PORT: 7007
      BACKEND_BASE_URL: http://localhost:7007
      APP_BASE_URL: http://localhost:3000
      # GitHub integration (optional)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ORG: ${GITHUB_ORG:-}
      # GitLab integration (optional; use the hostname only)
      GITLAB_HOST: ${GITLAB_HOST:-gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      KDASHM_AGENT_MODELS_FILE: C:/app/kdashm-agent-models.json
      # Database configuration
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
    volumes:
      - type: bind
        source: ./app-config.yaml
        target: C:/app/app-config.yaml
        read_only: true
      - type: bind
        source: ./app-config.production.yaml
        target: C:/app/app-config.production.yaml
        read_only: true
      - type: bind
        source: ./kdashm-agent-models.json
        target: C:/app/kdashm-agent-models.json
        read_only: true
      - type: bind
        source: ./examples
        target: C:/app/examples
        read_only: true
      - type: bind
        source: ./templates
        target: C:/app/templates
        read_only: true
      - type: bind
        source: ./infra-agent
        target: C:/app/infra-agent
    depends_on:
      postgres:
        condition: service_healthy

  # ========== Backstage Frontend (static SPA) ==========
  backstage-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.windows
    image: backstage-frontend:windows
    container_name: backstage-frontend-win
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backstage-backend

volumes:
  backstage_data_win:
    driver: local

networks:
  default:
    driver: bridge
