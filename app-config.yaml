app:
  title: Scaffolded Backstage App
  baseUrl: ${APP_BASE_URL:-http://localhost:3000}

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  # GitHub organization for the org overview dashboard
  github:
    org: ${GITHUB_ORG}

  extensions:
    # Keep the service catalog available alongside the custom portal home.
    - page:catalog:
        config:
          path: /catalog


organization:
  name: My Company

# GitHub organization for the org overview dashboard (also set under app.github.org for frontend access)
github:
  org: ${GITHUB_ORG}

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  # Browser API requests use the frontend origin and are proxied by nginx.
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    frame-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: ${APP_BASE_URL:-http://localhost:3000}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: pg
    connection:
      host: localhost
      port: 5432
      user: backstage
      password: ${POSTGRES_PASSWORD}
      database: backstage
  #   client: better-sqlite3
  #   connection: ':memory:'
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}
  gitlab:
    - host: ${GITLAB_HOST:-gitlab.com}
      baseUrl: ${GITLAB_BASE_URL:-https://gitlab.com}
      apiBaseUrl: ${GITLAB_API_BASE_URL:-https://gitlab.com/api/v4}
      token: ${GITLAB_TOKEN:-}

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: localKubectlProxy

proxy:
  endpoints:
    '/github/api':
      target: 'https://api.github.com'
      changeOrigin: true
      headers:
        Authorization: 'Bearer ${GITHUB_TOKEN}'
        Accept: 'application/vnd.github.v3+json'

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  environment: development
  providers:
    local:
      development: {}

  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

# scaffolder:
#   see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [User, Group, Component, System, API, Resource, Location]
  locations:
    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: ../../examples/entities.yaml

    # Local example template
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

    # GitHub Repository Template
    - type: file
      target: ../../templates/github-repo-template/template.yaml
      rules:
        - allow: [Template]

    # GitLab Repository Template
    - type: file
      target: ../../templates/gitlab-repo-template/template.yaml
      rules:
        - allow: [Template]

    # Python Application Template
    - type: file
      target: ../../templates/python-app-template/template.yaml
      rules:
        - allow: [Template]

    # Project archetypes published to the configured GitLab instance
    - type: file
      target: ../../templates/rest-api-service/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/event-driven-service/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/background-worker/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/react-frontend/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/full-stack-application/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/kubernetes-workload/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/helm-chart/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/aks-application/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/terraform-module/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/terraform-environment/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/ai-agent/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/single-agent/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/multi-agent-system/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/rag-application/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/ml-training-pipeline/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/nlp-training-pipeline/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/mcp-server/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

    ## GitHub org discovery — auto-ingests users and groups from your GitHub org
    ## Uncomment when ready (requires GITHUB_TOKEN with read:org scope)
    # - type: github-org
    #   target: https://github.com/${GITHUB_ORG}
    #   rules:
    #     - allow: [User, Group]

# kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true
  rbac:
    admin:
      users:
        - name: user:default/admin
      superUsers:
        - name: user:default/admin
    pluginsWithPermission:
      - catalog
      - permission
      - scaffolder
      - kdashm
      - pipelines

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'My Company Backstage' # defaults to "backstage"
  description: 'Tools for managing your software catalog, creating new services from templates, and exploring your developer portal' # optional
