apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mcp-server
  title: MCP Server
  description: Scaffold a runnable TypeScript Model Context Protocol server with stdio transport and a customizable starter tool.
  tags: [mcp, model-context-protocol, typescript, nodejs, server]
spec:
  owner: user:guest
  type: service
  parameters:
    - title: MCP server details
      required: [name, description, owner, toolName, toolDescription, repoUrl]
      properties:
        name:
          title: Server name
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          default: user:guest
        toolName:
          title: Starter tool name
          type: string
          default: greet
          pattern: '^[a-zA-Z0-9_-]+$'
        toolDescription:
          title: Starter tool description
          type: string
          default: Greets a person by name.
        repoUrl:
          title: GitLab repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - 20.192.10.29
            allowedOwners:
              - skynet
  steps:
    - id: fetch
      name: Generate MCP server
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          toolName: ${{ parameters.toolName }}
          toolDescription: ${{ parameters.toolDescription }}
    - id: publish
      name: Publish to GitLab
      action: publish:gitlab
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: GitLab repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog component
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}