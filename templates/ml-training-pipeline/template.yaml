apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ml-training-pipeline
  title: ML Training Pipeline
  description: Scaffold a continuous supervised ML pipeline that ingests labeled records, trains, evaluates, and retrains a user-selected model.
  tags: [machine-learning, streaming, training, evaluation, python]
spec:
  owner: user:guest
  type: service
  parameters:
    - title: Pipeline details
      required: [name, description, owner, featureColumns, targetColumn, taskType, modelKind, repoUrl]
      properties:
        name: { title: Pipeline name, type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$' }
        description: { title: Description, type: string }
        owner: { title: Owner, type: string, default: user:guest }
        featureColumns:
          title: Feature columns
          type: string
          description: Comma-separated field names included in each incoming record.
          default: feature_a,feature_b
        targetColumn:
          title: Target column
          type: string
          description: Label or numeric target field used for supervised training and evaluation.
          default: target
        taskType:
          title: ML task
          type: string
          enum: [classification, regression]
          default: classification
        modelKind:
          title: Starter model
          type: string
          enum: [random_forest, extra_trees]
          default: random_forest
        minimumTrainingRows:
          title: Minimum labeled rows before first training
          type: integer
          default: 80
          minimum: 10
        retrainEveryRecords:
          title: Retrain after this many new labeled records
          type: integer
          default: 25
          minimum: 1
        testFraction:
          title: Evaluation holdout fraction
          type: number
          default: 0.2
          minimum: 0.05
          maximum: 0.5
        repoUrl:
          title: GitLab repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - 20.192.10.29
            allowedOwners:
              - skynet
  steps:
    - id: fetch
      name: Generate ML training pipeline
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          featureColumns: ${{ parameters.featureColumns }}
          targetColumn: ${{ parameters.targetColumn }}
          taskType: ${{ parameters.taskType }}
          modelKind: ${{ parameters.modelKind }}
          minimumTrainingRows: ${{ parameters.minimumTrainingRows }}
          retrainEveryRecords: ${{ parameters.retrainEveryRecords }}
          testFraction: ${{ parameters.testFraction }}
    - id: publish
      name: Publish to GitLab
      action: publish:gitlab
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: GitLab repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog component
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}