apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: terraform-environment
  title: Terraform Environment
  description: Scaffold a provider-neutral Terraform root module with environment inputs and shared tags.
  tags: [terraform, infrastructure, environment]
spec:
  owner: user:guest
  type: resource
  parameters:
    - title: Environment details
      required: [name, description, owner, environment, repoUrl]
      properties:
        name: { title: Environment name, type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$' }
        description: { title: Description, type: string }
        owner: { title: Owner, type: string, default: user:guest }
        environment:
          title: Environment
          type: string
          enum: [development, test, staging, production]
        repoUrl:
          title: GitLab repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - 20.192.10.29
            allowedOwners:
              - skynet
  steps:
    - id: fetch
      name: Generate Terraform environment
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          environment: ${{ parameters.environment }}
    - id: publish
      name: Publish to GitLab
      action: publish:gitlab
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: GitLab repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog component
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}